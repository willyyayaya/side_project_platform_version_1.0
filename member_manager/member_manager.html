<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員維護系統 | 管理員登入頁面</title>
    <link rel="stylesheet" type="text/css" href="./member_manager.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- <script src="./member_manager.js"></script> -->
</head>
<body>
    <nav class="navBar">
        <ul>
            <li><p>會員維護系統</p></li>
            <li><a id="mMButton" href="./member_manager.html">會員維護</a></li>
            <li><a id="oMButton" href="../order_manager/order_manager.html">專案維護</a></li>
        </ul>
    </nav>
    <div class="mainBody">
        <div class="up">
            <input id="memberEmail" type="text" placeholder="請輸入信箱" autocomplete="on" />
            <button class="listButton" id="searchButton" onclick="searchMember()">查詢</button>
            <button class="listButton" id="clearButton" onclick="clearInputs()">清除</button>
        </div>
        <div class="down">
            <div class="memberList" id="memberList"></div>
            <div class="detail" id="detailContent"></div>
        </div>
    </div>
    <footer class="footer">
        <small>Author: Willy Weng</small>
        <br>
        <small>Contact: willyyayaya@gmail.com</small>
    </footer>
    <dialog>
        <div>
            <svg id="i-alert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentcolor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                <path d="M16 3 L30 29 2 29 Z M16 11 L16 19 M16 23 L16 25" />
            </svg>
        </div>
        <div>
            <h3>確定要刪除此會員嗎？</h3>
            <h4>注意：刪除無法復原！</h4>
        </div>
        <form method="dialog">
            <footer>
                <button class="listButton confirm">確定</button>
                <button class="listButton" onclick="closeDialog()">取消</button>
            </footer>
        </form>
    </dialog>
    <script src="./member_manager.js"></script>
</body>
</html>
